<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw Agency – Premium Org Chart</title>
  <meta name="description" content="OpenClaw Agency organizational structure – interactive premium chart">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">
  <canvas id="particles" aria-hidden="true"></canvas>

  <div class="container">
    <header class="header">
      <div class="brand">
        <h1>OpenClaw Agency</h1>
        <p class="tagline">Where intelligence meets structure</p>
      </div>
      <div class="controls">
        <button id="theme-toggle" class="btn-icon" aria-label="Toggle theme">
          <span class="sun">☀️</span><span class="moon">🌙</span>
        </button>
      </div>
    </header>

    <main class="org-tree" role="tree" aria-label="Organizational hierarchy" tabindex="0" id="org-tree">
      <!-- tree will be injected by JS -->
    </main>

    <footer class="footer">
      <span>&copy; 2026 OpenClaw Agency</span>
      <span class="sep">•</span>
      <span>Premium Org Chart</span>
    </footer>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip"></div>

  <script src="script.js"></script>
</body>
</html>
